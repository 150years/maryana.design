    title: Услуги
    h1: "Услуги дизайна интерьера на Пхукете"
    intro: "M Studio работает по трём направлениям. Главное из них — мебельные пакеты: вилла или кондоминиум, обставленные до последней ложки."
    extras_title: "Также входит"
    other: "Другие услуги"
    items:
      - slug: furniture-packages
        title: "Мебельные пакеты"
        image: /assets/images/projects/40/BF_FQ22-11.jpg
        description: "Мебельные пакеты на Пхукете от M Studio: комплектация вилл и кондоминиумов под ключ — мебель на заказ, свет, текстиль, декор, доставка, установка и финальная расстановка."
        card: "Комплектация вилл и кондоминиумов под ключ: мебель на заказ, стеновые панели, свет, техника, уличная мебель, текстиль, постельное бельё, картины, посуда, крупный и мелкий декор, доставка, установка и финальная расстановка. Всё готово к тому, чтобы клиент просто заехал и жил, ничего не докупая."
        body:
          - "Мебельные пакеты — для тех, кто хочет получить полностью обставленный дом, готовый к жизни, без десятков поставщиков и самостоятельных покупок."
          - "M Studio комплектует каждую виллу или кондоминиум под ключ. В зависимости от объекта в пакет входят мебель на заказ для дома и террасы, стеновые панели, свет, техника, шторы и текстиль, матрасы и постельное бельё, картины, ковры, зеркала, посуда, кухонные принадлежности, крупный и мелкий декор — и все детали, с которыми дом ощущается законченным."
          - "Мы берём на себя доставку, установку, сборку мебели, монтаж стеновых панелей и финальную расстановку. Каждый предмет подбираем под размеры, архитектуру и стиль объекта, поэтому интерьер получается цельным, а не набором отдельно купленных вещей."
          - "Наша цель проста: когда проект завершён, клиент приезжает с чемоданом и сразу начинает жить — ничего не докупая."
          - "Мебельные пакеты подходят для частных резиденций, домов для отдыха и инвестиционных объектов под аренду."
        closing: "От мебели до последней мелочи — M Studio готовит дом к жизни."
        extras:
          - title: "Комплектация под ключ"
            text: "Полная комплектация объекта на Пхукете — мебель, свет, техника, уличная мебель, картины, текстиль, посуда, постельное бельё и декор, с доставкой, сборкой и финальной расстановкой."
          - title: "Хоум-стейджинг"
            text: "Хоум-стейджинг и меблировка инвестиционных объектов, чтобы они были привлекательными, удобными и готовыми к сдаче или продаже."
          - title: "Декор интерьера"
            text: "Картины, текстиль, декор, оформление террасы и финальная подготовка объекта."
      - slug: interior-design-renovation
        title: "Дизайн интерьера и ремонт"
        image: /assets/images/projects/8/23.jpg
        description: "Дизайн интерьера и ремонт на Пхукете от M Studio: планировка, материалы, свет, санузлы и встроенная мебель для вилл и кондоминиумов."
        card: "Дизайн интерьера и ремонт под ключ: от планировки и выбора материалов до отделки, света, встроенной мебели и финальной расстановки."
        body:
          - "Дизайн интерьера и ремонт — для тех, кто хочет полностью преобразить объект: от планировки до последних деталей отделки."
          - "M Studio разрабатывает концепцию интерьера целиком и ведёт все изменения, которые нужны, чтобы её воплотить. В зависимости от проекта это перепланировка, подбор материалов и отделки, стены, полы, окна и двери, световой дизайн и электрика, ремонт санузлов и встроенная мебель — шкафы, кухни, системы хранения."
          - "Мы координируем проект от начала до конца, поэтому клиенту не нужно самому управлять подрядчиками, поставщиками и графиками монтажа. Каждое решение — от материалов до света — принимаем с учётом архитектуры объекта и того, как будет использоваться пространство."
          - "После ремонта мы можем обставить и оформить дом, чтобы в нём можно было сразу жить или сдавать его."
          - "Услуга подходит для вилл и кондоминиумов, которым нужно полное обновление, новая планировка или совершенно новый стиль интерьера."
        closing: "От первого плана до последней детали M Studio создаёт интерьеры, готовые к жизни."
        extras:
          - title: "Дизайн интерьера виллы"
            text: "Интерьер частной виллы целиком — в Банг Тао, Лаяне, Чернгталее и других районах Пхукета. Работаем с владельцами, застройщиками и подрядчиками от концепции до финальной расстановки."
          - title: "Дизайн интерьера кондоминиума"
            text: "Интерьеры кондоминиумов и апартаментов — для владельцев, которые в них живут, и для инвесторов, которые их сдают."
          - title: "Координация проекта"
            text: "Одна команда ведёт подрядчиков, поставщиков и графики монтажа — владелец общается только с M Studio."
      - slug: custom-furniture
        title: "Мебель на заказ"
        image: /assets/images/projects/19/13.jpg
        description: "Мебель на заказ на Пхукете от M Studio: отдельные предметы и меблировка комнат по размерам и стилю вашей виллы или кондоминиума, для дома и террасы."
        card: "Индивидуальная меблировка и мебель на заказ, спроектированная под стиль, размеры и задачи вашего объекта."
        body:
          - "Мебель на заказ — для тех, кому не нужен полный мебельный пакет, но нужно обставить конкретную комнату или добавить отдельные предметы."
          - "Это может быть гостиная или спальня, шкафы, обеденные или журнальные столы, кровати, уличная мебель для террасы или зоны у бассейна, а также мебель точно по размерам помещения."
          - "Каждый предмет проектируем под стиль, размеры и задачи объекта. Помогаем выбрать материалы, отделку и ткани, а также подбираем готовую мебель и декор, чтобы завершить комнату."
          - "M Studio берёт на себя производство, доставку и установку, и новая мебель естественно вписывается в существующий интерьер."
        closing: "Один предмет или целая комната — M Studio делает мебель, которая подходит пространству и вашему образу жизни."
        extras:
          - title: "Уличная мебель"
            text: "Мебель на заказ для террас, садов и зон у бассейна — из натуральных материалов, которые выдерживают тропический климат."
          - title: "Подбор мебели"
            text: "Готовая мебель и декор от проверенных поставщиков и мебель на заказ с фабрик в Чиангмае, Бангкоке и Индонезии."
