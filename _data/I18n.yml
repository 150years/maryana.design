    intro: M Studio Interior Design берёт на себя весь интерьер объекта на Пхукете — от первой концепции до готового к жизни или сдаче дома.
    items:
      - title: Дизайн интерьера на Пхукете
        text: Дизайн интерьера для частных домов, домов для отдыха и объектов под аренду по всему Пхукету. Каждый интерьер мы планируем под то, как объектом будут пользоваться на самом деле. Натуральные материалы и тёплые тона под тропический климат.
      - title: Дизайн интерьера виллы
        text: Интерьер частной виллы целиком — в Банг Тао, Лаяне, Чернгталее и других районах Пхукета. Работаем с владельцами, застройщиками и подрядчиками от концепции до финальной расстановки.
      - title: Дизайн интерьера кондоминиума
        text: Интерьеры кондоминиумов и апартаментов — для владельцев, которые в них живут, и для инвесторов, которые их сдают.
      - title: Комплектация под ключ
        text: Полная комплектация объекта на Пхукете — мебель, свет, техника, уличная мебель, картины, текстиль, посуда, постельное бельё и декор, с доставкой, сборкой и финальной стилизацией.
      - title: Мебельные пакеты
        text: Мебельные пакеты для вилл и кондоминиумов, подобранные под планировку и назначение объекта — для жизни, отдыха или сдачи в аренду.
      - title: Мебель на заказ
        text: Мебель на заказ для дома и террасы из натуральных материалов — производство в Чиангмае, Бангкоке и Индонезии.
      - title: Хоум-стейджинг
        text: Хоум-стейджинг и комплектация инвестиционной недвижимости, чтобы объект выглядел привлекательно, был удобен и готов к сдаче или продаже.
      - title: Стилизация интерьера
        text: Стилизация и декор — картины, текстиль, декор, оформление террасы и финальная подготовка объекта.
