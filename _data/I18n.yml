    h1: "Interior Design Services in Phuket"
    intro: "M Studio works in three directions. Furniture Packages are the core of the studio: a villa or condominium furnished down to the last spoon."
    extras_title: "Also included"
    other: "Other services"
    items:
      - slug: furniture-packages
        title: "Furniture Packages"
        image: /assets/images/projects/40/BF_FQ22-11.jpg
        description: "Furniture Packages in Phuket by M Studio: turnkey furnishing for villas and condominiums, from custom furniture and lighting to bedding, décor, delivery, installation and final styling."
        card: "Complete turnkey furnishing for villas and condominiums, including custom furniture, wall panels, lighting, appliances, outdoor furniture, textiles, bedding, artwork, tableware, large and small décor, delivery, installation and final styling. Everything is prepared so the client can simply move in and live without needing to purchase anything else."
        body:
          - "Our Furniture Packages are designed for clients who want a fully furnished and ready-to-live-in property without having to coordinate dozens of suppliers or purchase additional items themselves."
          - "M Studio provides a complete turnkey furnishing solution tailored to each villa or condominium. Depending on the property, the package can include custom-made indoor and outdoor furniture, wall panels, lighting, appliances, curtains and textiles, mattresses and bedding, artwork, rugs, mirrors, tableware, kitchen accessories, large and small décor, as well as all the finishing details that make a home feel complete."
          - "We also take care of delivery, installation, furniture assembly, wall panel installation and final styling. Every item is selected according to the dimensions, architecture and overall style of the property, so the result feels cohesive rather than like a collection of separately purchased pieces."
          - "Our goal is simple: when the project is completed, the client should be able to arrive with a suitcase and start living in the property immediately — without needing to buy anything else."
          - "Furniture Packages can be created for private residences, holiday homes and investment properties prepared for rental."
        closing: "From furniture to the smallest detail, M Studio prepares the entire property for living."
        extras:
          - title: "Turnkey Furnishing"
            text: "A complete turnkey furnishing service in Phuket — furniture, lighting, appliances, outdoor furniture, artwork, textiles, kitchenware, bedding and décor, with delivery, installation and final styling."
          - title: "Home Staging"
            text: "Home staging and furnishing for investment properties, so they are attractive, practical and ready for rental or sale."
          - title: "Interior Styling"
            text: "Interior styling and decoration — artwork, textiles, décor, outdoor styling and the final setup of the property."
      - slug: interior-design-renovation
        title: "Interior Design & Renovation"
        image: /assets/images/projects/8/23.jpg
        description: "Interior design and renovation in Phuket by M Studio: space planning, materials, lighting, bathrooms and built-in furniture for villas and condominiums."
        card: "Complete interior design and renovation solutions, from space planning and material selection to finishes, lighting, built-in furniture and final styling."
        body:
          - "Our Interior Design & Renovation service is for clients who want to transform a property completely — from the layout to the final finishing details."
          - "M Studio develops the full interior concept and manages the changes needed to bring it to life. Depending on the project, this can include space planning and layout changes, selection of materials and finishes, walls, flooring, windows and doors, lighting design and electrical work, bathroom renovation, and built-in furniture such as wardrobes, kitchens and storage."
          - "We coordinate the project from start to finish, so the client does not have to manage contractors, suppliers and installation schedules separately. Every decision — from materials to lighting — is made with the architecture of the property and the way the space will be used in mind."
          - "Once the renovation is complete, we can also furnish and style the property, so it is ready to live in or to rent out."
          - "Interior Design & Renovation is suitable for villas and condominiums that need a full update, a new layout or a completely new interior style."
        closing: "From the first plan to the final detail, M Studio creates interiors that are ready for living."
        extras:
          - title: "Villa Interior Design"
            text: "Complete interiors for private villas in Bang Tao, Layan, Cherngtalay and other areas of Phuket. We work with owners, developers and contractors from the initial concept to the final setup of the villa."
          - title: "Condominium Interior Design"
            text: "Interiors for condominiums and apartments — for owners who live in them and for investors who rent them out."
          - title: "Project Coordination"
            text: "One team coordinates contractors, suppliers and installation schedules, so the owner deals with M Studio alone."
      - slug: custom-furniture
        title: "Custom Furniture & Furnishing"
        image: /assets/images/projects/19/13.jpg
        description: "Custom furniture in Phuket by M Studio: individual pieces and single rooms furnished to the size and style of your villa or condominium, indoor and outdoor."
        card: "Individual furnishing solutions and custom-made furniture designed specifically for the style, dimensions and needs of your property."
        body:
          - "Our Custom Furniture & Furnishing service is for clients who do not need a complete furniture package but want to furnish a specific room or add individual pieces."
          - "This can be a single living room or bedroom, wardrobes, dining or coffee tables, beds, outdoor furniture for a terrace or pool area, or furniture made to the exact dimensions of the space."
          - "Every piece is designed for the style, dimensions and needs of the property. We help choose materials, finishes and fabrics, and we can also source ready-made furniture and décor to complete the room."
          - "M Studio takes care of production, delivery and installation, so the new furniture fits naturally into the existing interior."
        closing: "Whether it is one piece or a whole room, M Studio creates furniture that fits the space and the way you live."
        extras:
          - title: "Outdoor Furniture"
            text: "Custom outdoor furniture for terraces, gardens and pool areas, made from natural materials that suit the tropical climate."
          - title: "Furniture Sourcing"
            text: "Ready-made furniture and décor from trusted suppliers, and custom pieces made at factories in Chiang Mai, Bangkok and Indonesia."
