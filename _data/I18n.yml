    h1: "บริการออกแบบตกแต่งภายในในภูเก็ต"
    intro: "M Studio ให้บริการ 3 ด้าน งานหลักของเราคือแพ็กเกจเฟอร์นิเจอร์ ตกแต่งวิลล่าหรือคอนโดมิเนียมครบทุกชิ้นจนพร้อมเข้าอยู่"
    extras_title: "รวมถึง"
    other: "บริการอื่น ๆ"
    items:
      - slug: furniture-packages
        title: "แพ็กเกจเฟอร์นิเจอร์"
        image: /assets/images/projects/40/BF_FQ22-11.jpg
        description: "แพ็กเกจเฟอร์นิเจอร์ในภูเก็ตโดย M Studio: ตกแต่งวิลล่าและคอนโดมิเนียมครบวงจร ตั้งแต่เฟอร์นิเจอร์สั่งทำ ไฟ เครื่องนอน ของตกแต่ง ไปจนถึงจัดส่ง ติดตั้ง และจัดสไตล์ขั้นสุดท้าย"
        card: "ตกแต่งวิลล่าและคอนโดมิเนียมครบวงจร ทั้งเฟอร์นิเจอร์สั่งทำ ผนังตกแต่ง ไฟ เครื่องใช้ไฟฟ้า เฟอร์นิเจอร์ภายนอก ผ้า เครื่องนอน งานศิลปะ ภาชนะ ของตกแต่งชิ้นใหญ่และชิ้นเล็ก พร้อมจัดส่ง ติดตั้ง และจัดสไตล์ขั้นสุดท้าย ทุกอย่างพร้อมให้ลูกค้าย้ายเข้าอยู่ได้ทันทีโดยไม่ต้องซื้ออะไรเพิ่ม"
        body:
          - "แพ็กเกจเฟอร์นิเจอร์ของเราออกแบบมาสำหรับลูกค้าที่ต้องการบ้านที่ตกแต่งครบและพร้อมเข้าอยู่ โดยไม่ต้องประสานงานกับผู้จำหน่ายหลายสิบรายหรือซื้อของเพิ่มเอง"
          - "M Studio ตกแต่งวิลล่าหรือคอนโดมิเนียมแต่ละแห่งแบบครบวงจร แพ็กเกจอาจรวมเฟอร์นิเจอร์สั่งทำทั้งภายในและภายนอก ผนังตกแต่ง ไฟ เครื่องใช้ไฟฟ้า ผ้าม่านและผ้า ที่นอนและเครื่องนอน งานศิลปะ พรม กระจก ภาชนะ อุปกรณ์ครัว ของตกแต่งชิ้นใหญ่และชิ้นเล็ก รวมถึงรายละเอียดทุกอย่างที่ทำให้บ้านสมบูรณ์"
          - "เราดูแลการจัดส่ง ติดตั้ง ประกอบเฟอร์นิเจอร์ ติดตั้งผนังตกแต่ง และจัดสไตล์ขั้นสุดท้าย ทุกชิ้นคัดเลือกตามขนาด สถาปัตยกรรม และสไตล์ของบ้าน ผลลัพธ์จึงกลมกลืนเป็นหนึ่งเดียว ไม่ใช่ของที่ซื้อแยกกันมาวางรวมกัน"
          - "เป้าหมายของเราเรียบง่าย เมื่อโครงการเสร็จ ลูกค้าเพียงถือกระเป๋าเดินทางมาก็เข้าอยู่ได้ทันที โดยไม่ต้องซื้ออะไรเพิ่ม"
          - "แพ็กเกจเฟอร์นิเจอร์เหมาะสำหรับบ้านส่วนตัว บ้านพักตากอากาศ และอสังหาริมทรัพย์เพื่อการลงทุนที่เตรียมปล่อยเช่า"
        closing: "ตั้งแต่เฟอร์นิเจอร์จนถึงรายละเอียดที่เล็กที่สุด M Studio เตรียมบ้านทั้งหลังให้พร้อมสำหรับการอยู่อาศัย"
        extras:
          - title: "ตกแต่งพร้อมเฟอร์นิเจอร์ครบวงจร"
            text: "บริการตกแต่งครบวงจรในภูเก็ต ทั้งเฟอร์นิเจอร์ ไฟ เครื่องใช้ไฟฟ้า เฟอร์นิเจอร์ภายนอก งานศิลปะ ผ้า เครื่องครัว เครื่องนอน และของตกแต่ง พร้อมจัดส่ง ติดตั้ง และจัดสไตล์ขั้นสุดท้าย"
          - title: "โฮมสเตจจิ้ง"
            text: "โฮมสเตจจิ้งและการตกแต่งอสังหาริมทรัพย์เพื่อการลงทุน ให้ดูน่าสนใจ ใช้งานได้จริง และพร้อมให้เช่าหรือขาย"
          - title: "จัดสไตล์ภายใน"
            text: "การจัดสไตล์และตกแต่ง งานศิลปะ ผ้า ของตกแต่ง การจัดพื้นที่ภายนอก และการเตรียมบ้านขั้นสุดท้าย"
      - slug: interior-design-renovation
        title: "ออกแบบตกแต่งภายในและรีโนเวท"
        image: /assets/images/projects/8/23.jpg
        description: "ออกแบบตกแต่งภายในและรีโนเวทในภูเก็ตโดย M Studio: วางผัง วัสดุ ไฟ ห้องน้ำ และเฟอร์นิเจอร์บิวท์อินสำหรับวิลล่าและคอนโดมิเนียม"
        card: "ออกแบบตกแต่งภายในและรีโนเวทครบวงจร ตั้งแต่การวางผังและเลือกวัสดุ ไปจนถึงงานตกแต่งผิว ไฟ เฟอร์นิเจอร์บิวท์อิน และจัดสไตล์ขั้นสุดท้าย"
        body:
          - "บริการออกแบบตกแต่งภายในและรีโนเวทเหมาะสำหรับลูกค้าที่ต้องการเปลี่ยนบ้านทั้งหลัง ตั้งแต่ผังพื้นที่จนถึงรายละเอียดงานตกแต่งขั้นสุดท้าย"
          - "M Studio พัฒนาแนวคิดการตกแต่งภายในทั้งหมดและดูแลทุกการเปลี่ยนแปลงที่จำเป็นเพื่อให้เกิดขึ้นจริง ขึ้นอยู่กับโครงการ อาจรวมถึงการวางผังและปรับผังใหม่ การเลือกวัสดุและงานผิว ผนัง พื้น หน้าต่างและประตู การออกแบบแสงและงานไฟฟ้า การรีโนเวทห้องน้ำ และเฟอร์นิเจอร์บิวท์อิน เช่น ตู้เสื้อผ้า ห้องครัว และที่เก็บของ"
          - "เราประสานงานโครงการตั้งแต่ต้นจนจบ ลูกค้าจึงไม่ต้องจัดการผู้รับเหมา ผู้จำหน่าย และตารางการติดตั้งเอง ทุกการตัดสินใจ ตั้งแต่วัสดุจนถึงแสงไฟ คำนึงถึงสถาปัตยกรรมของบ้านและการใช้งานพื้นที่จริง"
          - "เมื่อรีโนเวทเสร็จ เรายังตกแต่งเฟอร์นิเจอร์และจัดสไตล์ให้ได้ เพื่อให้บ้านพร้อมเข้าอยู่หรือปล่อยเช่า"
          - "บริการนี้เหมาะสำหรับวิลล่าและคอนโดมิเนียมที่ต้องการปรับปรุงทั้งหมด ผังใหม่ หรือสไตล์การตกแต่งภายในใหม่ทั้งหมด"
        closing: "ตั้งแต่แบบแปลนแรกจนถึงรายละเอียดสุดท้าย M Studio สร้างสรรค์ภายในที่พร้อมสำหรับการอยู่อาศัย"
        extras:
          - title: "ออกแบบภายในวิลล่า"
            text: "การออกแบบภายในวิลล่าส่วนตัวทั้งหลังในบางเทา ลายัน เชิงทะเล และพื้นที่อื่น ๆ ของภูเก็ต เราทำงานร่วมกับเจ้าของ ผู้พัฒนาโครงการ และผู้รับเหมา ตั้งแต่แนวคิดแรกจนถึงการจัดวางขั้นสุดท้าย"
          - title: "ออกแบบภายในคอนโดมิเนียม"
            text: "การออกแบบภายในคอนโดมิเนียมและอพาร์ทเมนต์ สำหรับเจ้าของที่อยู่อาศัยเองและนักลงทุนที่ปล่อยเช่า"
          - title: "ประสานงานโครงการ"
            text: "ทีมเดียวดูแลผู้รับเหมา ผู้จำหน่าย และตารางการติดตั้ง เจ้าของบ้านติดต่อกับ M Studio เพียงที่เดียว"
      - slug: custom-furniture
        title: "เฟอร์นิเจอร์สั่งทำ"
        image: /assets/images/projects/19/13.jpg
        description: "เฟอร์นิเจอร์สั่งทำในภูเก็ตโดย M Studio: เฟอร์นิเจอร์แต่ละชิ้นหรือทั้งห้อง ตามขนาดและสไตล์ของวิลล่าหรือคอนโดมิเนียม ทั้งภายในและภายนอก"
        card: "ตกแต่งเฉพาะส่วนและเฟอร์นิเจอร์สั่งทำ ออกแบบให้ตรงกับสไตล์ ขนาด และการใช้งานของบ้านคุณ"
        body:
          - "บริการเฟอร์นิเจอร์สั่งทำเหมาะสำหรับลูกค้าที่ไม่ต้องการแพ็กเกจเฟอร์นิเจอร์ทั้งหลัง แต่ต้องการตกแต่งห้องใดห้องหนึ่งหรือเพิ่มเฟอร์นิเจอร์บางชิ้น"
          - "อาจเป็นห้องนั่งเล่นหรือห้องนอน ตู้เสื้อผ้า โต๊ะอาหารหรือโต๊ะกลาง เตียง เฟอร์นิเจอร์ภายนอกสำหรับระเบียงหรือริมสระว่ายน้ำ หรือเฟอร์นิเจอร์ที่ทำตามขนาดพื้นที่จริง"
          - "ทุกชิ้นออกแบบตามสไตล์ ขนาด และการใช้งานของบ้าน เราช่วยเลือกวัสดุ งานผิว และผ้า และยังจัดหาเฟอร์นิเจอร์สำเร็จรูปและของตกแต่งเพื่อให้ห้องสมบูรณ์"
          - "M Studio ดูแลการผลิต จัดส่ง และติดตั้ง เฟอร์นิเจอร์ใหม่จึงเข้ากับการตกแต่งเดิมอย่างเป็นธรรมชาติ"
        closing: "ไม่ว่าจะเป็นชิ้นเดียวหรือทั้งห้อง M Studio สร้างเฟอร์นิเจอร์ที่เข้ากับพื้นที่และวิถีชีวิตของคุณ"
        extras:
          - title: "เฟอร์นิเจอร์ภายนอก"
            text: "เฟอร์นิเจอร์ภายนอกสั่งทำสำหรับระเบียง สวน และริมสระว่ายน้ำ จากวัสดุธรรมชาติที่เหมาะกับอากาศเขตร้อน"
          - title: "จัดหาเฟอร์นิเจอร์"
            text: "เฟอร์นิเจอร์สำเร็จรูปและของตกแต่งจากผู้จำหน่ายที่เชื่อถือได้ และเฟอร์นิเจอร์สั่งทำจากโรงงานในเชียงใหม่ กรุงเทพฯ และอินโดนีเซีย"
