    about_me: О студии M Studio
    name: Марьяна Котова
    position: Основатель и ведущий дизайнер
    header: Студия дизайна интерьера на Пхукете, Таиланд
    description: |
      <p><strong>M Studio — студия дизайна интерьера на Пхукете. Мы делаем интерьеры под ключ для частных вилл, кондоминиумов и инвестиционной недвижимости.</strong></p>
      <p>Студию основала дизайнер интерьера <strong>Марьяна Котова</strong>. M Studio создаёт тёплые современные интерьеры под то, как объектом будут пользоваться на самом деле: как собственным домом, домом для отдыха или объектом под аренду.</p>
      <p>Мы не ограничиваемся дизайн-проектом. Мы делаем <strong>комплектацию под ключ на Пхукете</strong>: планировка, подбор мебели и мебель на заказ, свет, техника, уличная мебель, картины, текстиль, посуда, постельное бельё, декор, доставка, сборка и финальная стилизация.</p>
      <p>Всё время проекта мы работаем с владельцами, застройщиками, подрядчиками и мебельными фабриками и ведём детали от первой концепции до готового объекта.</p>
      <p>У M Studio есть проекты вилл и резиденций по всему Пхукету, в том числе в <strong>Банг Тао, Лаяне и Чернгталее</strong>, а также в комплексах Botanica и Clover Residence.</p>
      <p>Наш подход — функциональность, комфорт и спокойная современная эстетика для жизни в тропиках. Мы выбираем натуральные материалы, тёплые тона и решения, которые не устареют, а не интерьеры ради эффектной картинки.</p>
      <p>Для инвестиционной недвижимости мы также делаем <strong>хоум-стейджинг и комплектацию</strong>, чтобы объект был привлекательным, удобным и готовым к сдаче или продаже.</p>
    services_title: "Наши услуги:"
