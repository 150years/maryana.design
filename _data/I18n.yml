        text: Interior design for private homes, holiday residences and rental properties across Phuket. Each interior is planned around the way the property will actually be used, with natural materials and warm tones suited to tropical living.
      - title: Villa Interior Design
        text: Complete interiors for private villas in Bang Tao, Layan, Cherngtalay and other areas of Phuket. We work with owners, developers and contractors from the initial concept to the final setup of the villa.
      - title: Condominium Interior Design
        text: Interiors for condominiums and apartments — for owners who live in them and for investors who rent them out.
