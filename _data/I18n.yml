    header: Interior design studio in Phuket, Thailand
    description: |
      <p><strong>M Studio is an interior design studio based in Phuket, Thailand, specializing in complete interior solutions for private villas, condominiums and investment properties.</strong></p>
      <p>Founded by interior designer <strong>Maryana Kotova</strong>, M Studio creates warm, contemporary interiors designed around the way each property will actually be used — whether as a private home, holiday residence or rental investment.</p>
      <p>Our work goes beyond interior design. We provide a complete <strong>turnkey furnishing service in Phuket</strong>, including space planning, furniture selection and custom furniture, lighting, appliances, outdoor furniture, artwork, textiles, kitchenware, bedding, décor, delivery, installation and final styling.</p>
      <p>We work closely with property owners, developers, contractors and furniture manufacturers throughout the project, coordinating the details from the initial concept to the final setup of the property.</p>
      <p>M Studio has experience working with villas and residences across Phuket, including <strong>Bang Tao, Layan and Cherngtalay</strong>, as well as projects in developments such as Botanica and Clover Residence.</p>
      <p>Our approach combines functionality, comfort and a relaxed contemporary aesthetic suited to tropical living. We favor natural materials, warm tones and timeless solutions rather than interiors created only for visual impact.</p>
      <p>For investment properties, we also provide <strong>home staging and furnishing solutions</strong> designed to make the property attractive, practical and ready for rental or sale.</p>
