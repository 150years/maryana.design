{% assign t = site.data.I18n[page.lang] -%}
<div class="page-head">
  <h1>{{ t.services_page.h1 }}</h1>
  <p class="lead">{{ t.services_page.intro }}</p>
</div>
<div class="services row row-cols-1 row-cols-md-2 gx-md-5">
  {% for s in t.services_page.items %}
  <section class="col service">
    <span class="service-n" aria-hidden="true">{{ forloop.index | prepend: '0' | slice: -2, 2 }}</span>
    <h2 class="h4">{{ s.title }}</h2>
    <p>{{ s.text }}</p>
  </section>
  {% endfor %}
</div>
